<link rel="stylesheet" href="/static/shell.css?v={{shell_version}}">
<script>
  /* Apply the saved theme before first paint (no flash). "auto" = no attribute. */
  (() => { try { const t = localStorage.getItem("lifeos-theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {} })();
</script>
