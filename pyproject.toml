[project]
name = "life-dashboard"
version = "0.1.0"
description = "Life Dashboard (desktop :8090) + the Gmail bank-alert finance poller"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "httpx>=0.27",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "google-auth>=2.30",
    "pypdf>=6.19.0",
    "pdfplumber>=0.11.10",
    "cryptography>=50.0.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["pi"]
testpaths = ["tests"]
